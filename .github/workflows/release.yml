name: Build and Publish Template CVs

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:TL2025-historic
    permissions:
      contents: write
    strategy:
      matrix:
        lang: [en, fr, ar]

    steps:
      - uses: actions/checkout@v7

      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install -y gh
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Build the CV template
        run: |
          cd ${{ matrix.lang }}
          lualatex -interaction=nonstopmode cv.tex
          lualatex -interaction=nonstopmode cv-avatar.tex
          mv cv.pdf ${{ matrix.lang }}.pdf
          mv cv-avatar.pdf ${{ matrix.lang }}-avatar.pdf

      - name: Upload PDF to GitHub Release
        run: |
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.lang }}/${{ matrix.lang }}.pdf
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.lang }}/${{ matrix.lang }}-avatar.pdf
        env:
          GH_TOKEN: ${{ github.token }}
